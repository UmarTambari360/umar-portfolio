# Production stack: Postgres + Redis + API + web (Caddy).
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Only the "web" service publishes ports. Postgres, Redis and the API live on an
# internal network that the internet cannot reach: that is the main security win.
# (The development docker-compose.yml publishes DB ports for convenience; never
# do that on a public server.)

name: portfolio

# Reused by "server" and "migrate": both run the same image.
x-server: &server
  build:
    context: .
    dockerfile: server/Dockerfile
  image: portfolio-server:latest
  environment:
    NODE_ENV: production
    PORT: 5000
    CLIENT_ORIGIN: ${PUBLIC_URL:?Set PUBLIC_URL in .env.production, e.g. https://example.com}
    # One proxy (Caddy) sits in front: trust exactly one X-Forwarded-For hop.
    TRUST_PROXY: 1
    DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
    JWT_SECRET: ${JWT_SECRET:?}
    ADMIN_USERNAME: ${ADMIN_USERNAME:?}
    ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?}
    ANALYTICS_SALT: ${ANALYTICS_SALT:?}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies pending database migrations, then exits.
  # The API waits for it to finish successfully before starting.
  migrate:
    <<: *server
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *server
    restart: unless-stopped
    expose:
      - "5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: portfolio-web:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production, e.g. example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - caddy_data:/data # holds your TLS certificates: keep this volume!
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

