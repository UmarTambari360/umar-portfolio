version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: umar_portfolio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-portfolio_admin} -d ${POSTGRES_DB:-portfolio_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: umar_portfolio_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local